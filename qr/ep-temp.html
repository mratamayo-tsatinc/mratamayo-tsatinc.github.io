<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Permit Verification</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --primary: #4f8cff;
    --primary-dark: #2f6fe0;
    --bg: #0f1720;
    --surface: #16212c;
    --surface-alt: #1c2733;
    --text-main: #e7edf5;
    --text-secondary: #93a3b5;
    --border-color: #223040;
    --success: #35c98a;
    --danger: #ef5b5b;
    --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    font-family: 'Roboto', sans-serif;
    background: var(--bg); color: var(--text-main);
    -webkit-font-smoothing: antialiased;
  }

  .page-wrap {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 460px; margin: 0 auto;
    padding: 3rem 1.25rem 3.5rem;
  }

  /* Parallax layer: this element's transform is updated on scroll (see
     script below) so it drifts upward slower than the page scrolls,
     giving it a sense of depth relative to the card beneath it — same
     effect as it3-w4.html's results page. */
  .parallax-logo-layer {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-bottom: 1.25rem;
    will-change: transform;
  }

  .school-logo {
    display: block;
    width: 130px;
    height: 130px;
    margin: 0;
    padding: 0;
    border-radius: 50%;
    background: #ffffff;
    object-fit: contain;
    box-shadow: var(--shadow-lg);
  }

  .verify-card {
    width: 100%; background: var(--surface); border-radius: 16px;
    box-shadow: var(--shadow-lg); overflow: hidden;
    animation: scaleIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative; z-index: 1;
  }
  @keyframes scaleIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }

  .verify-header {
    padding: 1.5rem 1.75rem;
    background: linear-gradient(135deg, var(--primary), #7c3aed);
    text-align: center;
  }
  .verify-header .verify-kicker {
    margin: 0 0 4px; font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: rgba(255,255,255,0.85);
  }
  .verify-header h1 {
    margin: 0; color: #fff; font-size: 1.25rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }

  .status-banner {
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    padding: 0.7rem 1rem; font-size: 0.82rem; font-weight: 700;
    letter-spacing: 0.3px; text-transform: uppercase;
  }
  .status-banner.valid { background: rgba(53,201,138,0.14); color: var(--success); }
  .status-banner.invalid { background: rgba(239,91,91,0.12); color: var(--danger); }

  .verify-body { padding: 1.75rem; }

  .period-pill {
    display: inline-block; margin-bottom: 1.25rem;
    padding: 5px 14px; border-radius: 999px;
    background: rgba(79,140,255,0.14); color: var(--primary);
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase;
  }

  .info-section { text-align: left; }
  .info-row {
    display: flex; align-items: flex-start; gap: 0.9rem;
    padding: 0.85rem 0; border-bottom: 1px solid var(--border-color);
  }
  .info-row:last-child { border-bottom: none; }
  .info-icon {
    width: 34px; height: 34px; flex-shrink: 0; border-radius: 8px;
    background: rgba(79,140,255,0.12); color: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 0.95rem;
  }
  .info-text-group { flex: 1; min-width: 0; }
  .info-label {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text-secondary); margin-bottom: 3px;
  }
  .info-value {
    font-size: 0.98rem; font-weight: 600; color: var(--text-main); word-break: break-word;
  }
  .info-value.mono { font-family: 'Roboto Mono', monospace; font-size: 0.92rem; }

  .verify-footnote {
    margin-top: 1.5rem; padding-top: 1rem; border-top: 1px dashed var(--border-color);
    font-size: 0.76rem; line-height: 1.5; color: var(--text-secondary); text-align: center;
  }
  .verify-timestamp {
    margin-top: 0.6rem; font-size: 0.72rem; color: var(--text-secondary); text-align: center;
    font-family: 'Roboto Mono', monospace;
  }

  .error-card { padding: 2.25rem 1.75rem; text-align: center; }
  .error-card i { font-size: 2rem; color: var(--danger); margin-bottom: 0.75rem; display: block; }
  .error-card p { margin: 0; color: var(--text-secondary); font-size: 0.9rem; line-height: 1.5; }

  /* ---- Subjects & attendance (fetched separately via
     /api/exam-permit/verify, NOT part of the QR payload) — appended
     below the decrypted info-section. Rendered progressively: the
     info-section above paints immediately from the local decryption,
     this section fills in a moment later once the network call
     resolves. ---- */
  .subjects-section { margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); }
  .subjects-heading {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--text-secondary); margin: 0 0 0.75rem;
  }
  .subject-card {
    background: var(--surface-alt); border: 1px solid var(--border-color); border-radius: 10px;
    padding: 0.7rem 0.85rem; margin-bottom: 0.55rem;
  }
  .subject-card:last-child { margin-bottom: 0; }
  .subject-card-top { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; }
  .subject-code-pill {
    font-family: 'Roboto Mono', monospace; font-size: 0.7rem; font-weight: 700;
    color: var(--primary); background: rgba(79,140,255,0.14); border-radius: 5px; padding: 1px 7px;
    flex-shrink: 0;
  }
  .subject-title { font-size: 0.86rem; font-weight: 600; color: var(--text-main); }
  .subject-meta { font-size: 0.72rem; color: var(--text-secondary); margin-top: 3px; }
  .subject-attendance {
    margin-top: 0.5rem; padding-top: 0.5rem; border-top: 1px solid var(--border-color);
    display: flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600;
  }
  .subject-attendance.synced { color: var(--text-main); }
  .subject-attendance.not-synced { color: var(--text-secondary); font-style: italic; font-weight: 400; }
  .subjects-skel {
    height: 62px; border-radius: 10px; margin-bottom: 0.55rem;
    background: linear-gradient(90deg, var(--surface-alt) 25%, rgba(255,255,255,0.06) 37%, var(--surface-alt) 63%);
    background-size: 400% 100%; animation: subj-shimmer 1.4s ease infinite;
  }
  @keyframes subj-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .subjects-unavailable {
    font-size: 0.78rem; color: var(--text-secondary); text-align: center; padding: 0.5rem 0;
  }
</style>
</head>
<body>
  <div class="page-wrap">
    <div class="parallax-logo-layer" id="parallaxLogoLayer">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRvc9o3Q_YlbNhYjvTouDZAAy0TzLAHHYabzuq6VtXNf7VXiUHYUEFkemOj&s=10" alt="School logo" class="school-logo">
    </div>

    <div class="verify-card">
      <div class="verify-header">
        <p class="verify-kicker">Digital Verification</p>
        <h1><i class="fa-solid fa-shield-halved" aria-hidden="true"></i> Exam Permit</h1>
      </div>
      <div id="statusBanner"></div>
      <div id="verifyBody" class="verify-body">
        <div class="error-card">
          <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
          <p>Verifying permit&hellip;</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // These MUST exactly match TEMP_PERMIT_QR_PASSPHRASE / TEMP_PERMIT_QR_SALT
    // in exampermit.html, or decryption fails.
    const TEMP_PERMIT_QR_PASSPHRASE = 'EP-TEMP-7f3ac91b-52ea-4bd0-9c31-88b6fd201a44';
    const TEMP_PERMIT_QR_SALT = 'exam-permit-temp-qr-salt-v1';

    // Base URL of the SASRS API (same backend exampermit.html talks to).
    // This page is a static, standalone deployment (see TEMP_PERMIT_VIEW_URL
    // in exampermit.html) with no server-side templating, so — unlike
    // exampermit.html's apiBaseUrl — this has to be hardcoded here and kept
    // in sync manually with wherever the API actually lives.
    const EXAM_PERMIT_VERIFY_API_BASE = 'https://test-api.tsathub.cloud/sms/api';

    async function deriveTempPermitQrKey() {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        'raw',
        enc.encode(TEMP_PERMIT_QR_PASSPHRASE),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );
      return crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: enc.encode(TEMP_PERMIT_QR_SALT),
          iterations: 100000,
          hash: 'SHA-256'
        },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    function base64UrlToBytes(base64url) {
      const base64 = base64url.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64 + '='.repeat((4 - base64.length % 4) % 4);
      const binary = atob(padded);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function decryptTempPermitPayload(token) {
      const combined = base64UrlToBytes(token);
      const iv = combined.slice(0, 12);
      const ciphertext = combined.slice(12);
      const key = await deriveTempPermitQrKey();
      const plaintextBuffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
      return JSON.parse(new TextDecoder().decode(plaintextBuffer));
    }

    function periodLabel(period) {
      const labels = { PRELIM: 'Prelim', MIDTERM: 'Midterm', SEMIFINALS: 'Semifinals', FINALS: 'Finals' };
      return labels[period] || period || '\u2014';
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function infoRow(icon, label, value, mono) {
      return '<div class="info-row">' +
        '<span class="info-icon"><i class="' + icon + '" aria-hidden="true"></i></span>' +
        '<div class="info-text-group">' +
          '<div class="info-label">' + escapeHtml(label) + '</div>' +
          '<div class="info-value' + (mono ? ' mono' : '') + '">' + escapeHtml(value || '\u2014') + '</div>' +
        '</div>' +
      '</div>';
    }

    function renderValid(data) {
      document.getElementById('statusBanner').innerHTML =
        '<div class="status-banner valid"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Permit Recognized</div>';

      const term = [data.ay, data.sem].filter(Boolean).join(' / ');
      const printedAt = data.t ? new Date(data.t * 1000).toLocaleString() : '\u2014';

      document.getElementById('verifyBody').innerHTML =
        '<span class="period-pill">' + escapeHtml(periodLabel(data.p)) + ' Exam Permit</span>' +
        '<div class="info-section">' +
          infoRow('fa-solid fa-user', 'Name', data.n) +
          infoRow('fa-solid fa-id-card', 'Student No.', data.sn, true) +
          infoRow('fa-solid fa-file-signature', 'Registration No.', data.rn, true) +
          infoRow('fa-solid fa-chalkboard', 'Class', data.c) +
          infoRow('fa-solid fa-calendar-days', 'Term', term) +
        '</div>' +
        '<div class="subjects-section" id="subjectsSection"></div>' +
        '<p class="verify-footnote">Present this together with a valid school ID.</p>' +
        '<p class="verify-timestamp">Printed ' + escapeHtml(printedAt) + '</p>';
    }

    // ---- Subjects & attendance — fetched separately, NOT decoded from
    // the QR payload itself (see EXAM_PERMIT_VERIFY_API_BASE above and
    // ExamPermitController::verifyTemporaryPermit() server-side). The
    // SAME encrypted token is sent as-is; the server decrypts it and
    // looks up the subject list, so nothing new is ever encoded into
    // the printed QR code. ----

    function renderSubjectsLoading() {
      const el = document.getElementById('subjectsSection');
      if (!el) return;
      el.innerHTML =
        '<p class="subjects-heading">Subjects &amp; Attendance</p>' +
        '<div class="subjects-skel"></div><div class="subjects-skel"></div>';
    }

    function renderSubjectsUnavailable() {
      const el = document.getElementById('subjectsSection');
      if (!el) return;
      el.innerHTML =
        '<p class="subjects-heading">Subjects &amp; Attendance</p>' +
        '<p class="subjects-unavailable">Subject and attendance details aren\u2019t available right now &mdash; check with the registrar or the full system for the complete record.</p>';
    }

    function renderSubjects(subjects) {
      const el = document.getElementById('subjectsSection');
      if (!el) return;

      if (!subjects || !subjects.length) {
        el.innerHTML =
          '<p class="subjects-heading">Subjects &amp; Attendance</p>' +
          '<p class="subjects-unavailable">No enrolled subjects found for this term.</p>';
        return;
      }

      const cards = subjects.map(function (sub) {
        const att = sub.attendance || {};
        const hasRate = att.ratePercent !== null && att.ratePercent !== undefined;
        const attText = hasRate
          ? ((att.present + att.late) + '/' + att.totalMeetings + ' (' + att.ratePercent + '%)')
          : 'Not yet synced';
        const attIcon = hasRate ? 'fa-solid fa-circle-check' : 'fa-regular fa-clock';

        return '<div class="subject-card">' +
          '<div class="subject-card-top">' +
            '<span class="subject-code-pill">' + escapeHtml(sub.subjectCode) + '</span>' +
            '<span class="subject-title">' + escapeHtml(sub.subjectTitle) + '</span>' +
          '</div>' +
          '<div class="subject-meta">' + escapeHtml(sub.teacherName) + ' &middot; ' + escapeHtml(sub.classCode) + '</div>' +
          '<div class="subject-attendance ' + (hasRate ? 'synced' : 'not-synced') + '">' +
            '<i class="' + attIcon + '" aria-hidden="true"></i> ' + escapeHtml(attText) +
          '</div>' +
        '</div>';
      }).join('');

      el.innerHTML = '<p class="subjects-heading">Subjects &amp; Attendance</p>' + cards;
    }

    async function fetchFullPermitDetails(token) {
      try {
        const url = EXAM_PERMIT_VERIFY_API_BASE + '/exam-permit/verify?token=' + encodeURIComponent(token);
        const res = await fetch(url);
        const body = await res.json().catch(function () { return null; });
        if (!body || body.ok !== true) return null;
        return body;
      } catch (err) {
        console.error('Failed to fetch subjects/attendance:', err);
        return null;
      }
    }

    function renderInvalid() {
      document.getElementById('statusBanner').innerHTML =
        '<div class="status-banner invalid"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> Could Not Verify</div>';
      document.getElementById('verifyBody').innerHTML =
        '<div class="error-card">' +
          '<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>' +
          '<p>This QR code could not be read. It may be damaged, incomplete, or not a valid exam permit code.</p>' +
        '</div>';
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('d');

      let data = null;
      try {
        if (token) data = await decryptTempPermitPayload(token);
      } catch (err) {
        console.error('Failed to decrypt temporary permit payload:', err);
      }

      if (data && data.sn) {
        renderValid(data);
        renderSubjectsLoading();
        // Same token, sent as-is — the server re-derives the same key/IV
        // handling to decrypt it and look up the subject list. No new
        // fields are ever added to the QR payload for this.
        const full = await fetchFullPermitDetails(token);
        if (full) {
          renderSubjects(full.subjects);
        } else {
          renderSubjectsUnavailable();
        }
      } else {
        renderInvalid();
      }
    }

    if (document.readyState === 'complete') {
      init();
    } else {
      window.addEventListener('load', init);
    }

    // --- PARALLAX LOGO SCROLL EFFECT ---
    // The logo drifts at a fraction of the page's scroll speed (0.4x),
    // so as the card scrolls up past it, the logo lags behind — the
    // classic parallax "layers moving at different depths" look. Same
    // effect as it3-w4.html's results page. rAF-throttled so it doesn't
    // run more than once per paint.
    (function setupParallax() {
        const layer = document.getElementById('parallaxLogoLayer');
        if (!layer) return;

        let ticking = false;

        function updateParallax() {
            const offset = window.scrollY * 0.4;
            layer.style.transform = `translateY(${offset}px)`;
            ticking = false;
        }

        window.addEventListener('scroll', () => {
            if (!ticking) {
                requestAnimationFrame(updateParallax);
                ticking = true;
            }
        }, { passive: true });
    })();
  </script>
</body>
</html>
